<!DOCTYPE html>
<html>
<head>
<meta name="disabled-adaptations" content="watch">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#0b192c;color:#fff;padding:4px}
.tabs{display:flex;gap:3px;margin-bottom:4px}
.tab{flex:1;background:#1e2d42;color:#9ab3d5;border:none;padding:6px 0;border-radius:6px;font-size:10px;font-weight:800}
.tab.active{background:#0a84ff;color:#fff}
.scr{display:none;flex-direction:column;gap:4px}
.scr.active{display:flex}
#vi{width:100%;background:#223854;border:2px solid #0a84ff;border-radius:6px;color:#fff;font-size:12px;font-weight:700;padding:5px;text-align:center}
#ev{text-align:center;font-size:12px;font-weight:800;color:#30d158;background:#113322;padding:3px;border-radius:6px}
#tb{background:#15263d;border-radius:10px;padding:10px 2px;text-align:center;border:2px solid #2b4568}
#tb.cd{background:#472d00;border-color:#ff9f0a}
#tb.rn{background:#4a1212;border-color:#ff453a}
#st{font-size:9px;font-weight:800;color:#9ab3d5}
#tm{font-size:28px;font-weight:800;margin:2px 0}
.row{display:flex;gap:3px}
.btn{flex:1;background:#1e2d42;color:#fff;border:none;border-radius:6px;padding:6px 0;font-size:10px;font-weight:800}
.sv{background:#30d158;color:#000}
.cd{background:#15263d;border-radius:6px;padding:5px;font-size:10px;margin-bottom:3px}
input{width:100%;background:#223854;border:none;color:#fff;padding:5px;border-radius:5px;font-size:10px;margin-bottom:3px}
</style>
</head>
<body>
<div class="tabs">
  <button class="tab active" onclick="tab('s',this)">SWIM</button>
  <button class="tab" onclick="tab('c',this)">CLASS</button>
  <button class="tab" onclick="tab('m',this)">MEETS</button>
</div>
<div id="s" class="scr active">
  <input id="vi" placeholder="Say: 50 Free Start" autocomplete="off">
  <div id="ev">50 FREE</div>
  <div id="tb" onclick="tap()">
    <div id="st">READY (5S DELAY)</div>
    <div id="tm">00.00</div>
  </div>
  <div class="row">
    <button class="btn" onclick="adj(-0.2)">-0.2s</button>
    <button class="btn" onclick="adj(-0.5)">-0.5s</button>
    <button class="btn sv" onclick="save()">SAVE</button>
  </div>
</div>
<div id="c" class="scr">
  <div id="cl"></div>
  <button class="btn" style="background:#4a1212;color:#ff453a" onclick="endC()">END CLASS</button>
</div>
<div id="m" class="scr">
  <input id="mn" placeholder="Meet Name">
  <input id="md" type="date">
  <input id="mt" placeholder="Official Time">
  <button class="btn" style="background:#0a84ff" onclick="addM()">+ ADD MEET</button>
  <div id="ml"></div>
</div>
<script>
let st='i',ev='50 FREE',t0=0,ms=0,ti,ci,d=JSON.parse(localStorage.getItem('pss')||'{"t":[],"l":{},"m":[]}');
const sv=()=>localStorage.setItem('pss',JSON.stringify(d));
function tab(x,b){document.querySelectorAll('.scr,.tab').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');b.classList.add('active');if(x=='c')rc();if(x=='m')rm();}
const vi=document.getElementById('vi');
vi.oninput=vi.onchange=()=>{
  let v=vi.value.toLowerCase(),dm=v.match(/\b(25|50|100|200)\b/),sm=v.match(/\b(free|back|breast|fly|im)\b/),am=v.match(/\b(start|go|stop|done)\b/);
  if(dm||sm){ev=(dm?dm[1]:ev.split(' ')[0])+' '+(sm?sm[1].toUpperCase():ev.split(' ')[1]);document.getElementById('ev').textContent=ev;}
  if(am){let act=am[1];vi.value='';vi.blur();if((act=='start'||act=='go')&&st!='r'&&st!='c')cd();if((act=='stop'||act=='done')&&st=='r')stp();}
};
function tap(){if(st=='r')stp();else if(st=='i'||st=='s')cd();else{clearInterval(ci);rst();}}
function cd(){st='c';ms=0;let s=5,b=document.getElementById('tb');b.className='cd';document.getElementById('st').textContent='GET READY!';document.getElementById('tm').textContent='05.00';ci=setInterval(()=>{s--;if(s>0)document.getElementById('tm').textContent='0'+s+'.00';else{clearInterval(ci);run();}},1000);}
function run(){st='r';t0=performance.now();let b=document.getElementById('tb');b.className='rn';document.getElementById('st').textContent='SWIMMING...';ti=setInterval(()=>{ms=performance.now()-t0;document.getElementById('tm').textContent=fmt(ms);},31);}
function stp(){clearInterval(ti);ms=performance.now()-t0;st='s';document.getElementById('tb').className='';document.getElementById('st').textContent='FINISHED';document.getElementById('tm').textContent=fmt(ms);}
function adj(x){if(st=='s'){ms=Math.max(0,ms+x*1000);document.getElementById('tm').textContent=fmt(ms);}}
function save(){if(ms>0){d.t.push({e:ev,m:ms});sv();rst();document.getElementById('st').textContent='SAVED!';}}
function rst(){st='i';document.getElementById('tb').className='';document.getElementById('st').textContent='READY (5S DELAY)';}
function fmt(x){let s=x/1000,m=Math.floor(s/60),r=(s%60).toFixed(2).padStart(5,'0');return m>0?m+':'+r:r;}
function rc(){document.getElementById('cl').innerHTML=d.t.length?d.t.map(i=>{let p=d.l[i.e],df='First!';if(p){let k=(i.m-p)/1000;df=k<0?`<b style="color:#30d158">${Math.abs(k).toFixed(2)}s FASTER</b>`:`<b style="color:#ff453a">+${k.toFixed(2)}s SLOWER</b>`;}return `<div class="cd"><b>${i.e}</b> ${fmt(i.m)}<br>${df}</div>`;}).join(''):'<div class="cd">No swims today</div>';}
function endC(){d.t.forEach(i=>{if(!d.l[i.e]||i.m<d.l[i.e])d.l[i.e]=i.m;});d.t=[];sv();rc();}
function addM(){let n=document.getElementById('mn').value.trim();if(!n)return;d.m.unshift({n,d:document.getElementById('md').value,t:document.getElementById('mt').value});sv();document.getElementById('mn').value='';document.getElementById('mt').value='';rm();}
function rm(){document.getElementById('ml').innerHTML=d.m.length?d.m.map(x=>`<div class="cd"><b>${x.n}</b> (${x.d||'TBD'})<br><span style="color:#30d158">${x.t}</span></div>`).join(''):'<div class="cd">No meets yet</div>';}
</script>
</body>
</html>
